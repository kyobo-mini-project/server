plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'eclipse'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // This dependency is used by the application.
    implementation libs.guava
    implementation libs.mybatis
    implementation libs.jbcrypt
    runtimeOnly libs.postgresql
}

testing {
    suites {
        // Configure the built-in test suite
        test {
            // Use JUnit Jupiter test framework
            useJUnitJupiter('6.0.1')
        }
    }
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'com.kyobo.server.App'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('run', JavaExec) {
    standardInput = System.in
    // Java 21 기본 출력은 UTF-8인데, Windows IntelliJ 콘솔은 보통 MS949라
    // UTF-8을 강제하면 한글이 한자처럼 깨진다. Windows만 콘솔 네이티브 인코딩(COMPAT) 사용.
    def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
    if (isWindows) {
        jvmArgs '-Dfile.encoding=UTF-8',
                '-Dstdout.encoding=COMPAT',
                '-Dstderr.encoding=COMPAT',
                '-Dsun.stdout.encoding=COMPAT',
                '-Dsun.stderr.encoding=COMPAT'
    } else {
        jvmArgs '-Dfile.encoding=UTF-8',
                '-Dstdout.encoding=UTF-8',
                '-Dstderr.encoding=UTF-8'
    }
}

